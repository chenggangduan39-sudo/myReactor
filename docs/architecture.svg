<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title description">
  <title id="title">myReactor architecture</title>
  <desc id="description">The main Reactor accepts clients, creates connections and queues registration to one of three I/O loops. I/O loops parse requests and dispatch copied messages to five business workers. Workers queue responses back to the owning I/O loop through a task queue and socketpair wakeup. Socket writes occur in the I/O loop.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#52657b"/></marker>
    <marker id="greenArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#168275"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .heading { font-size: 19px; font-weight: 700; fill: #16324f; }
      .body { font-size: 15px; fill: #36506b; }
      .small { font-size: 13px; fill: #52657b; }
      .edge { fill: none; stroke: #52657b; stroke-width: 2; marker-end: url(#arrow); }
      .return { fill: none; stroke: #168275; stroke-width: 2.5; marker-end: url(#greenArrow); }
    </style>
  </defs>
  <rect x="1" y="1" width="1118" height="688" rx="20" fill="#f7f9fc" stroke="#d9e2ec"/>
  <rect x="1" y="1" width="1118" height="91" rx="20" fill="#16324f"/>
  <path d="M1 60 H1119 V92 H1 Z" fill="#16324f"/>
  <text x="36" y="43" font-size="27" font-weight="700" fill="#fff">myReactor</text>
  <text x="36" y="71" font-size="15" fill="#c8d9ea">Multi-Reactor TCP server / default configuration: 1 main + 3 I/O + 5 worker threads</text>
  <rect x="36" y="128" width="190" height="98" rx="12" fill="#fff" stroke="#c5d2df"/>
  <text x="131" y="166" text-anchor="middle" class="heading">TCP Clients</text>
  <text x="131" y="195" text-anchor="middle" class="body">IPv4 byte streams</text>
  <rect x="36" y="298" width="270" height="232" rx="14" fill="#eaf2ff" stroke="#9ab6df"/>
  <text x="56" y="332" class="heading">Main Reactor</text>
  <text x="56" y="357" class="small">Main thread / TcpServer</text>
  <rect x="56" y="377" width="230" height="62" rx="9" fill="#fff" stroke="#bfd0e8"/>
  <text x="171" y="402" text-anchor="middle" class="body">Acceptor + listen Channel</text>
  <text x="171" y="422" text-anchor="middle" class="small">Nonblocking accept / epoll ET</text>
  <rect x="56" y="452" width="230" height="57" rx="9" fill="#fff" stroke="#bfd0e8"/>
  <text x="171" y="477" text-anchor="middle" class="body">Connection registry</text>
  <text x="171" y="497" text-anchor="middle" class="small">shared_ptr / create + erase</text>
  <path d="M131 226 V298" class="edge"/>
  <text x="144" y="269" class="small">connect</text>
  <rect x="392" y="128" width="360" height="402" rx="14" fill="#e8f6f2" stroke="#89c4b4"/>
  <text x="414" y="163" class="heading">Sub Reactors / I/O Pool</text>
  <text x="414" y="188" class="small">3 threads / one EventLoop per thread</text>
  <rect x="414" y="209" width="316" height="71" rx="9" fill="#fff" stroke="#b0d8cb"/>
  <text x="572" y="237" text-anchor="middle" class="body">epoll + Connection Channels</text>
  <text x="572" y="261" text-anchor="middle" class="small">Read / inputBuffer / parseMessage</text>
  <rect x="414" y="309" width="316" height="75" rx="9" fill="#fff" stroke="#b0d8cb"/>
  <text x="572" y="337" text-anchor="middle" class="body">Task queue + socketpair wakeup</text>
  <text x="572" y="362" text-anchor="middle" class="small">Register connection / queue response</text>
  <path d="M434 309 V280" class="edge"/>
  <text x="448" y="299" class="small">register Channel</text>
  <rect x="414" y="426" width="316" height="80" rx="9" fill="#fff" stroke="#b0d8cb"/>
  <text x="572" y="454" text-anchor="middle" class="body">outputBuffer + EPOLLOUT</text>
  <text x="572" y="479" text-anchor="middle" class="small">sendTask / sendData</text>
  <path d="M572 384 V426" class="return"/>
  <path d="M306 414 H355 V346 H414" class="edge"/>
  <text x="310" y="295" class="small">fd % 3</text>
  <text x="310" y="315" class="small">addTask</text>
  <path d="M226 176 H335 V244 H414" class="edge"/>
  <text x="243" y="162" class="small">request bytes</text>
  <rect x="838" y="128" width="246" height="256" rx="14" fill="#fff3df" stroke="#ddbd7f"/>
  <text x="860" y="163" class="heading">Worker Pool</text>
  <text x="860" y="188" class="small">5 business threads</text>
  <rect x="858" y="209" width="206" height="71" rx="9" fill="#fff" stroke="#e6cfa5"/>
  <text x="961" y="237" text-anchor="middle" class="body">handleBusiness</text>
  <text x="961" y="261" text-anchor="middle" class="small">Echo the message body</text>
  <rect x="858" y="309" width="206" height="55" rx="9" fill="#fff" stroke="#e6cfa5"/>
  <text x="961" y="342" text-anchor="middle" class="body">sendMessage</text>
  <path d="M961 280 V309" class="edge"/>
  <path d="M730 244 H858" class="edge"/>
  <text x="762" y="213" class="small">conn +</text>
  <text x="762" y="231" class="small">body copy</text>
  <path d="M858 346 H730" class="return"/>
  <text x="765" y="318" class="small">addTask</text>
  <path d="M730 466 H795 V573 H18 V190 H36" class="return"/>
  <rect x="344" y="554" width="276" height="31" rx="6" fill="#f7f9fc"/>
  <text x="482" y="575" text-anchor="middle" class="body">response bytes / I/O thread writes</text>
  <rect x="36" y="610" width="1048" height="54" rx="10" fill="#fff" stroke="#d9e2ec"/>
  <text x="56" y="633" class="small">Thread ownership: connection registry on Main; input/output buffers and Socket I/O on the owning EventLoop.</text>
  <text x="56" y="653" class="small">Current protocol: 4-byte native-endian request length + body; responses are raw bodies with no ordering guarantee.</text>
</svg>
